<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Binance Multi-Agent Bot</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
      code { background: #f5f5f5; padding: 0.2rem 0.4rem; border-radius: 4px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
      .card { border: 1px solid #eee; border-radius: 8px; padding: 1rem; }
    </style>
  </head>
  <body>
    <h1>Binance Multi-Agent Bot</h1>
    <p>Сервисы подняты через Docker Compose. Проверки здоровья:</p>
    <div class="grid">
      <div class="card"><a href="http://localhost:8001/health">market-data /health</a></div>
      <div class="card"><a href="http://localhost:8002/health">strategy-engine /health</a></div>
      <div class="card"><a href="http://localhost:8003/health">order-executor /health</a></div>
      <div class="card"><a href="http://localhost:8004/health">risk /health</a></div>
      <div class="card"><a href="http://localhost:8005/health">backtester /health</a></div>
      <div class="card"><a href="http://localhost:8006/health">agents /health</a></div>
    </div>
  </body>
</html>
