version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"

  market-data:
    build:
      context: ./services/market_data
    environment:
      - APP_NAME=market-data
      - SERVICE_PORT=8000
    depends_on:
      - nats
    ports:
      - "8001:8000"

  strategy-engine:
    build:
      context: ./services/strategy_engine
    environment:
      - APP_NAME=strategy-engine
      - SERVICE_PORT=8000
    depends_on:
      - nats
    ports:
      - "8002:8000"

  order-executor:
    build:
      context: ./services/order_executor
    environment:
      - APP_NAME=order-executor
      - SERVICE_PORT=8000
    depends_on:
      - nats
      - postgres
      - redis
    ports:
      - "8003:8000"

  risk:
    build:
      context: ./services/risk
    environment:
      - APP_NAME=risk
      - SERVICE_PORT=8000
    depends_on:
      - postgres
    ports:
      - "8004:8000"

  backtester:
    build:
      context: ./services/backtester
    environment:
      - APP_NAME=backtester
      - SERVICE_PORT=8000
    depends_on:
      - postgres
    ports:
      - "8005:8000"

  agents:
    build:
      context: ./services/agents
    environment:
      - APP_NAME=agents
      - SERVICE_PORT=8000
    depends_on:
      - nats
    ports:
      - "8006:8000"

  ui:
    build:
      context: ./services/ui
    ports:
      - "3000:80"
    depends_on:
      - market-data
      - strategy-engine
      - order-executor
      - risk
      - backtester
      - agents

volumes:
  db_data: